server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Headers de seguridad ──────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # microphone=(self): el dictado por voz (RespuestaConVoz, Web Speech API)
    # necesita el micrófono en el propio sitio. Con microphone=() el navegador lo
    # bloqueaba siempre y el dictado fallaba con "not-allowed" en producción.
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;

    # ── Reglas de bloqueo de escaneo y archivos sensibles ─────────────────────
    # Bloquear acceso a archivos y directorios ocultos (.env, .git, etc.)
    # Permite .well-known para validaciones SSL/dominio si fuese necesario
    location ~ /\.(?!well-known) {
        return 404;
    }

    # Bloquear extensiones de scripts y archivos no estáticos de la SPA
    location ~* \.(php|aspx?|jsp|cgi|bak|sql|ya?ml|ini|sh|log|env)$ {
        return 404;
    }

    # Bloquear rutas de escaneo comunes de WordPress y servidores heredados
    location ~* /(?:wp-content|wp-includes|wp-admin|cgi-bin|wordpress)/ {
        return 404;
    }

    # Proxy todas las llamadas /api/* al backend
    location /api/ {
        proxy_pass ${BACKEND_SCHEME}://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header   Host              ${BACKEND_HOST};
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback — React Router maneja las rutas del lado cliente
    location / {
        try_files $uri $uri/ /index.html;
    }
}
